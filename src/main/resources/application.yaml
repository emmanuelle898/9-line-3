spring:
  application:
    name: 9-line-pairing-project

    datasource:
      url: jdbc:postgresql://localhost:5436/todo
      driver-class-name: org.postgresql.Driver
      username: devuser
      password: devpass

    flyway:
      enabled: true
      locations: classpath:db/migration

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true


server:
  port: 8080
